name: Debate runner

# Vercel's Hobby plan rejects a per-minute cron, so the debate runner is driven
# from here instead. GitHub's scheduler has a five-minute floor and can run late
# under load, which is why /api/debates/tick defaults to several turns per chat:
# a slow trigger still makes real progress.
#
# Notes on the GitHub scheduler:
#   - Scheduled workflows only run on the default branch.
#   - Runs can be delayed by several minutes at peak times. That is fine here;
#     each call advances up to `turns` turns per due chat.
#   - GitHub disables a schedule after 60 days without repository activity. Any
#     push re-enables it. Use "Run workflow" to check it manually.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      turns:
        description: Turns to advance per due chat (1-20)
        required: false
        default: '5'

# Never let two ticks overlap: they would fight over the same due chats.
concurrency:
  group: debate-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    name: Advance due debates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the secret is configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings > Secrets and variables > Actions, with the same value as the Vercel environment variable."
            exit 1
          fi

      - name: Tick the runner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TURNS: ${{ github.event.inputs.turns || '5' }}
        run: |
          set -o pipefail

          status=$(curl -sS -o tick.json -w '%{http_code}' \
            --max-time 90 \
            --retry 2 --retry-delay 5 --retry-connrefused \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://tarkasabha.vercel.app/api/debates/tick?turns=${TURNS}")

          echo "HTTP ${status}"
          cat tick.json
          echo

          case "$status" in
            200)
              # A non-zero failed count is worth surfacing but is not fatal: a
              # single chat can fail without stopping the rest of the tick.
              jq -r '"claimed \(.claimed) | advanced \(.advanced) | stopped \(.stopped) | failed \(.failed)"' tick.json
              failed=$(jq -r '.failed // 0' tick.json)
              if [ "$failed" != "0" ]; then
                echo "::warning::${failed} chat(s) failed to advance. Check the deployment logs."
              fi
              ;;
            401)
              echo "::error::Unauthorized. The repository secret does not match CRON_SECRET in Vercel."
              exit 1
              ;;
            *)
              echo "::error::Tick returned HTTP ${status}."
              exit 1
              ;;
          esac
